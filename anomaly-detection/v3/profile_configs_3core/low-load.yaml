# §63 3-core 정상 부하 profile qualification 후보(2026-09-20) - v1/§59의
# 0.10 RPS는 4-core calibration(2026-09-16)에서 나온 값이라 v3 학습
# profile에서 제외(§63.1) - 3-core A-B-A(§62)에서 A1/B/A2 전부 SLO
# 경계(threshold=0.648s 안팎)에 있었으므로 그보다 낮은 0.025 RPS를 후보로
# 쓴다. payload(url/model/prompt/max_tokens)는 기존 generator와 완전 동일,
# duration_sec=180은 기존 low_load 관례 유지(강도만 재선정, 길이는 새로
# 고르지 않음).
target:
  url: "http://vllm-active.vllm-serving.svc.cluster.local:8000/v1/completions"
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  prompt: "Hello"
  max_tokens: 10

stages:
  - name: v3core3-low-load
    rps: 0.025
    duration_sec: 180
