# lab-cpu3-warm-v1 + SLO v3(threshold=0.648s) 하 load_ramp 강도 재탐색용
# 설정 (2026-09-18, §22 사전 등록 참고) - scenario-load-ramp.yaml 본편과는
# 별개이며, 최종 후보 확정 전까지 반복해서 고쳐 쓴다. 기존
# scenario-load-ramp-explore.yaml(v2/4코어 시절 이력)은 덮어쓰지 않는다.
#
# 2차 탐색(1차 결과 반영): 1차(0.10~2.00RPS 7단계)에서 1.50/2.00RPS까지
# 넣었더니 큰 백로그가 쌓여 drain 60초로도 다 못 빠지는 현상이 나타났고
# (explore-20260918T095809Z), 이는 explore_ramp_intensity.py가 stage
# 경계를 "공칭" 시각(합계 630초)으로 계산해 실제 완주 시각(668.4초)과의
# 차이(~38초)만큼 아직 진행 중인 stage-7 트래픽을 drain으로 오분류한
# 것으로 보인다(원시 CSV 초 단위 확인 - t=675부터는 즉시 0.2초대로
# 복귀함, 스크립트가 보고한 "drain 위반"과 모순). 또한 stage-1 초반
# ~6초에 ramp+probe가 동시에 처음 트래픽을 내보내는 콜드스타트성
# 급등(최대 4.7초)이 있었다(L_baseline calibration 3회에서도 같은
# 패턴 관찰됨) - stage-1 전체 P95를 오염시켰다.
#
# 2차 탐색(0.10~1.00RPS, 5단계, explore-20260918T101717Z)은 harness
# 경계 버그가 있던 상태로 돈 것이라 후보 판단에서 제외했다(§23). harness
# 수정·이미지 재빌드·검증(§23.4~§23.7, explore-20260918T110801Z) 통과
# 후, 그 결과가 0.10RPS부터 이미 threshold를 살짝 넘기는 걸 보여줘
# (P95=0.691s) 3차 탐색은 0.10RPS 주변을 촘촘하게 본다 - 사용자 지정
# 범위, 각 stage 90초 유지.
target:
  url: "http://vllm-active.vllm-serving.svc.cluster.local:8000/v1/completions"
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  prompt: "Hello"
  max_tokens: 10

stages:
  - name: explore-0.05rps
    rps: 0.05
    duration_sec: 90
  - name: explore-0.075rps
    rps: 0.075
    duration_sec: 90
  - name: explore-0.10rps
    rps: 0.10
    duration_sec: 90
  - name: explore-0.125rps
    rps: 0.125
    duration_sec: 90
  - name: explore-0.15rps
    rps: 0.15
    duration_sec: 90
  - name: explore-0.20rps
    rps: 0.20
    duration_sec: 90
  - name: explore-0.25rps
    rps: 0.25
    duration_sec: 90
