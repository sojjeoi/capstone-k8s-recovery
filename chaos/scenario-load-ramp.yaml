# 고정 도착률(open-loop) 요청 폭주 시나리오
# closed-loop(가상 사용자 수 고정, 응답 기다렸다 다음 요청)는 서버가 느려지면
# 유입 요청률 자체가 줄어들어 장애를 과소측정하므로 사용 금지 — loadgen/ramp.py가
# 이 파일을 읽어 각 단계를 "초당 N건"으로 서버 응답과 무관하게 순서대로 실행한다.
#
# 1차 실행(1/3/6/12/20 RPS) 결과: 1 RPS는 100% 성공, 3 RPS에서 이미 63% 실패로
# 한계점이 1~3 RPS 사이에 있음을 확인. 6 RPS 이상은 전부 0~4% 성공(추가 정보 없음).
# 그런데 stage 요약(성공률)만으로는 그 60~90초 안에서 서서히 나빠졌는지(점진적 열화,
# 선제탐지 가능) 순간적으로 무너졌는지(절벽, 선제탐지 무의미)를 구분할 수 없었음 —
# ramp.py가 이제 요청 단위 원시 로그(-raw.csv)도 남기므로, 1~3 RPS 구간을 촘촘하게
# 다시 훑어서 그 안의 시간대별 성공률 추이를 확인한다. 6 RPS 이상은 이미 붕괴가
# 증명됐으므로 재확인용으로 한 단계만 남김.
target:
  url: "http://vllm-active.vllm-serving.svc.cluster.local:8000/v1/completions"
  model: "Qwen/Qwen2.5-0.5B-Instruct"
  prompt: "Hello"
  max_tokens: 10

stages:
  - name: stage-1-baseline    # idle->warmup 구간 데이터로도 재사용 가능 (9-4절)
    rps: 1
    duration_sec: 60
  - name: stage-2-fine-1.5
    rps: 1.5
    duration_sec: 90
  - name: stage-3-fine-2.0
    rps: 2
    duration_sec: 90
  - name: stage-4-fine-2.5
    rps: 2.5
    duration_sec: 90
  - name: stage-5-fine-3.0
    rps: 3
    duration_sec: 90
  - name: stage-6-confirm-collapse
    rps: 10
    duration_sec: 30
