# 점진적 메모리 압력 — 단일 StressChaos는 목표치로 즉시 점프(계단 1칸)하는 것으로 실측 확인됨
# 그래서 Workflow Serial로 여러 단계에 나눠 걸어 점증 추세를 만듦 (네트워크 열화 시나리오와 동일 기법 재사용)
# "메모리 누수"가 아니라 외부 stress 프로세스가 만드는 압력임 (9-1절 명명 원칙)
# 1~4단계는 "아직 버티는" 점진적 조짐 구간. 5단계(3.5GB)에서 총 사용량이 6871Mi로 한도(6Gi=6144Mi)를 넘겨
# 실제 OOM을 유도함 — 무개입 대조군에서 t_SLO_counterfactual을 측정하려면 실제 장애가 나야 하므로(9-3절) 필수
# vLLM 컨테이너 메모리 한도 6Gi(rollout.yaml) 대비 현재 사용량 ~3287Mi(9-8절 실측) 기준으로 역산
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: vllm-memory-ramp
  namespace: vllm-serving
spec:
  entry: ramp-serial
  templates:
    - name: ramp-serial
      templateType: Serial
      deadline: 14m
      children:
        - stage-1-500mb
        - stage-2-1gb
        - stage-3-1500mb
        - stage-4-2500mb
        - stage-5-3500mb-oom

    - name: stage-1-500mb
      templateType: StressChaos
      deadline: 2m
      stressChaos:
        mode: one
        selector:
          namespaces: [vllm-serving]
          labelSelectors:
            app: vllm-serving
        stressors:
          memory:
            workers: 1
            size: "500MB"

    - name: stage-2-1gb
      templateType: StressChaos
      deadline: 2m
      stressChaos:
        mode: one
        selector:
          namespaces: [vllm-serving]
          labelSelectors:
            app: vllm-serving
        stressors:
          memory:
            workers: 1
            size: "1GB"

    - name: stage-3-1500mb
      templateType: StressChaos
      deadline: 2m
      stressChaos:
        mode: one
        selector:
          namespaces: [vllm-serving]
          labelSelectors:
            app: vllm-serving
        stressors:
          memory:
            workers: 1
            size: "1500MB"

    - name: stage-4-2500mb
      templateType: StressChaos
      deadline: 2m
      stressChaos:
        mode: one
        selector:
          namespaces: [vllm-serving]
          labelSelectors:
            app: vllm-serving
        stressors:
          memory:
            workers: 1
            size: "2500MB"

    - name: stage-5-3500mb-oom
      templateType: StressChaos
      deadline: 4m
      stressChaos:
        mode: one
        selector:
          namespaces: [vllm-serving]
          labelSelectors:
            app: vllm-serving
        stressors:
          memory:
            workers: 1
            size: "5000MB" # 총 ~8407Mi로 6Gi(6144Mi) 한도를 37% 초과 — 3500MB 시도 때 실제로는 한도를 못 넘긴 것으로 추정돼(stress-ng가 요청 크기를 100% RSS로 확정 안 했을 가능성) 여유를 크게 잡음
