# image는 로컬 빌드 태그 - registry 안 쓰는 로컬 데모라 imagePullPolicy: Never.
# 워커 노드가 이 이미지를 실제로 갖고 있어야 함(예: 노드에서 직접 build,
# 또는 build 후 노드의 컨테이너 런타임으로 옮기기 - 방법은 자유).
#
# probe timeoutSeconds를 명시하는 이유: 발견 5(K8s 기본값 1초가 네트워크
# 열화 시 false-positive 재시작을 유발)에서 배운 대로, 여기서도 기본값에
# 맡기지 않고 명시적으로 값을 정한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-policy
  namespace: vllm-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recovery-policy
  template:
    metadata:
      labels:
        app: recovery-policy
    spec:
      serviceAccountName: recovery-policy
      containers:
        - name: recovery-policy
          image: recovery-policy:local
          imagePullPolicy: Never
          env:
            - name: RECOVERY_POLICY_DATA_DIR
              value: /data
            - name: GIT_REMOTE_URL
              value: https://github.com/sojjeoi/capstone-k8s-recovery.git
            - name: GIT_AUTHOR_NAME
              value: recovery-policy-bot
            - name: GIT_AUTHOR_EMAIL
              value: recovery-policy-bot@localhost
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recovery-policy-git-credentials
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8080
          # initialDelaySeconds를 넉넉히 둔 이유: FastAPI startup 훅에서
          # git_client.start_worker()가 최초 git clone을 끝낼 때까지 /healthz
          # 자체가 응답 못 함(실측: 기본값 10s로는 부족해서 clone 도중 liveness에
          # 죽어 PVC에 반쯤 된 저장소가 남는 걸 실제로 겪음 - git_client.py의
          # _ensure_repo() 주석 참고, clone 자체도 원자적으로 고쳤지만 probe도
          # 같이 넉넉하게 둬야 애초에 재시도 루프에 안 빠짐).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: recovery-policy-data
