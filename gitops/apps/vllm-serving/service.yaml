# BlueGreen active/preview Service 쌍 — Rollout이 promote 시 selector를 바꿔치기하는 대상
apiVersion: v1
kind: Service
metadata:
  name: vllm-active
  namespace: vllm-serving
  labels:
    app: vllm-serving # ServiceMonitor가 이 라벨로 스크랩 대상을 찾음(Service 자체의 라벨 — 위 spec.selector와는 별개)
spec:
  selector:
    app: vllm-serving
  ports:
    - name: http # ServiceMonitor가 포트를 이름으로 참조하기 위해 필요
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-preview
  namespace: vllm-serving
  labels:
    app: vllm-serving
spec:
  selector:
    app: vllm-serving
  ports:
    - name: http
      port: 8000
      targetPort: 8000
