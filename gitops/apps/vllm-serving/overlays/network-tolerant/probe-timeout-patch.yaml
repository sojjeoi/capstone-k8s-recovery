# 실측 검증 완료(2026-09-19): 11은 임의 값이 아니라 격리 calibration pod에서 후보 11초로
# 독립 2회 측정해 사전 등록 판정(§44.2)을 모두 PASS한 값이다.
#   - 최대 NetworkChaos 지연(4초+-0.4초, chaos/scenario-network-degrade.yaml stage-4)에서
#     probe 동등 /health 최대 지연 L_max = 8.72초(1회) / 8.64초(2회). 이론 상한은
#     왕복 2 x (4.0 + 0.4) = 8.8초다(지연이 SYN-ACK과 응답에 두 번 걸린다).
#   - 안전 여유 공식 T_req = max(1.25 x L_max, L_max + 1.5초) -> 10.90초 / 10.80초,
#     T_min = 올림 = 11 <= 11. 10은 이 공식에 못 미치는 후보였다(L_max > 8.0초면 부족).
#   - 두 회차 모두 steady 구간 probe 실패 0, liveness 실패 0, Ready 전이·restart 0.
#   - 한계: stage-4의 NetworkChaos 삭제 직후(삭제 요청 +3~5초) readiness probe가 단발 1건
#     실패하는 현상이 2회 모두 관찰됐다(사전 등록상 teardown 구간의 비연속 단발로 허용,
#     Ready·restart 무영향). 삭제 시 netem 큐 flush가 원인이라는 설명은 미검증 가설이다.
# 근거·증거: docs/design/phase8-blue-green-preflight-incident.md §44(규칙)·§45(결과),
# docs/design/evidence/network-tolerant-calibration/(원본 JSON·구간별 probe 이벤트).
# 이 값으로 network_degrade 3-arm 파일럿·본 실험을 하려면 여전히 사용자 승인이 필요하다 -
# run_network_degrade_trial.py --readiness-probe-timeout-sec 11 로 명시해야 하고, 그
# 스크립트가 실행 직전에 active pod의 실제 값과 대조 검증한다.
- op: add
  path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
  value: 11
- op: add
  path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
  value: 11
