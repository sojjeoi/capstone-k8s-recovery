# 9-5절 "A안 최소 안전장치" — recovery-policy가 쓸 최소권한 ServiceAccount
# Rollout patch/조회, Service selector 조회만 허용. 그 외 아무 권한도 없음.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-policy
  namespace: vllm-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-promoter
  namespace: vllm-serving
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-policy-rollout-promoter
  namespace: vllm-serving
subjects:
  - kind: ServiceAccount
    name: recovery-policy
    namespace: vllm-serving
roleRef:
  kind: Role
  name: rollout-promoter
  apiGroup: rbac.authorization.k8s.io
